[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accanto"
version = "0.1.0"
description = "A financial companion for planning a rich life."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "mattjmcnaughton", email = "me@mattjmcnaughton.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "authlib==1.7.2",
    "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/mattjmcnaughton/accanto"

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "ty>=0.0.54",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external: tests that hit external services",
]

[tool.hatch.build.targets.wheel]
packages = ["src/accanto"]

[tool.hatch.build]
artifacts = ["src/accanto/web/frontend/dist/**"]
exclude = ["**/node_modules/**", "**/*.tsbuildinfo"]
