# Amp Box deployment. Migrations run separately with the owner credential;
# this service only ever receives the restricted runtime DATABASE_URL.
build: bash scripts/box-build.sh
source: false
artifacts: [box-release]
services:
  web:
    cwd: box-release
    env:
      PYTHONPATH: site
      PYTHONNOUSERSITE: "1"
      PGSSLROOTCERT: site/certifi/cacert.pem
    command: >-
      sh -c 'BROWSER_ORIGIN="$AMP_DEPLOYMENT_URL" exec python/bin/python3 -m uvicorn
      accanto.app:app --host 0.0.0.0 --port "$PORT" --no-access-log'
  # Scheduled tick (TDD 11): a minute's wait, so a deploy's web start has the
  # CPU to itself, then one finite run and an hour's sleep; systemd restarts the
  # unit when it exits, so it repeats hourly and about a minute after each deploy.
  jobs:
    cwd: box-release
    env:
      PYTHONPATH: site
      PYTHONNOUSERSITE: "1"
      PGSSLROOTCERT: site/certifi/cacert.pem
    command: >-
      sh -c 'sleep 60; python/bin/python3 -m accanto.jobs.tick; exec sleep 3600'
